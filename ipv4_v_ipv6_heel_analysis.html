<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPv4 vs IPv6 — Achilles &amp; Hermes Heel Analysis</title>
  <style>
    html { font-size: 20px; } /* rem anchor — browser zoom scales everything */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #07090f;
      --surface:     #0c111e;
      --card:        #111827;
      --border:      #1a2540;
      --border-lt:   #263352;
      --ipv4:        #f59e0b;
      --ipv4-dim:    rgba(245,158,11,.12);
      --ipv4-bdr:    rgba(245,158,11,.28);
      --ipv6:        #38bdf8;
      --ipv6-dim:    rgba(56,189,248,.1);
      --ipv6-bdr:    rgba(56,189,248,.28);
      --ach:         #ef4444;
      --ach-dim:     rgba(239,68,68,.06);
      --ach-bdr:     rgba(239,68,68,.22);
      --her:         #f59e0b;
      --her-dim:     rgba(245,158,11,.06);
      --her-bdr:     rgba(245,158,11,.22);
      --txt:         #e2e8f0;
      --txt2:        #94a3b8;
      --txt3:        #64748b;
    }

    body {
      background: var(--bg);
      color: var(--txt);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-size: 0.875rem;
      line-height: 1.6;
      min-height: 100vh;
    }

    /* ─── HEADER ─── */
    .hdr {
      background: linear-gradient(180deg, #0b1122 0%, var(--bg) 100%);
      border-bottom: 1px solid var(--border);
      padding: 16px 22px 14px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .hdr-top {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .hdr-eyebrow {
      font-size: 0.65rem;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--txt3);
      margin-bottom: 4px;
    }
    .hdr-h1 {
      font-size: clamp(1rem, 1.2vw + 0.55rem, 1.35rem);
      font-weight: 700;
      letter-spacing: -.02em;
      color: #f1f5f9;
      line-height: 1.15;
    }
    .hdr-h1 .ach-word { color: #f87171; }
    .hdr-h1 .her-word { color: #fbbf24; }

    .hdr-legend {
      display: flex;
      gap: 14px;
      flex-shrink: 0;
    }
    .leg-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.66rem;
      color: var(--txt2);
    }
    .leg-dot {
      width: 8px; height: 8px;
      border-radius: 2px;
      flex-shrink: 0;
    }

    /* ─── MYTH METER ─── */
    .meters {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .meter-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 9px 13px;
    }
    .meter-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 7px;
      gap: 8px;
      flex-wrap: wrap;
    }
    .meter-proto {
      font-size: 0.66rem;
      font-weight: 800;
      letter-spacing: .09em;
      text-transform: uppercase;
    }
    .meter-proto.v4 { color: var(--ipv4); }
    .meter-proto.v6 { color: var(--ipv6); }
    .meter-scores {
      display: flex;
      gap: 10px;
      font-size: 0.59rem;
      color: var(--txt3);
    }
    .sc-a { color: #f87171; }
    .sc-h { color: #fbbf24; }
    .meter-track {
      height: 14px;
      background: rgba(255,255,255,.04);
      border-radius: 4px;
      position: relative;
      overflow: hidden;
    }
    .bar-a {
      position: absolute; left: 0; top: 0; height: 100%;
      border-radius: 4px 0 0 4px;
      background: linear-gradient(90deg, #991b1b, #ef4444);
      transition: width .9s cubic-bezier(.4,0,.2,1);
    }
    .bar-h {
      position: absolute; right: 0; top: 0; height: 100%;
      border-radius: 0 4px 4px 0;
      background: linear-gradient(90deg, #f59e0b, #92400e);
      transition: width .9s cubic-bezier(.4,0,.2,1);
    }
    .meter-labels {
      display: flex;
      justify-content: space-between;
      margin-top: 4px;
      font-size: 0.62rem;
      letter-spacing: .04em;
      color: var(--txt3);
    }

    /* ─── TWO-ROW METERS LAYOUT ─── */
    .meters-section {
      display: flex;
      flex-direction: column;
      gap: 7px;
      max-width: 660px;
      margin: 0 auto;
    }
    .meter-row-lbl {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--txt3);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .meter-row-lbl .domain-tag {
      color: var(--txt2);
      font-weight: 500;
      letter-spacing: .05em;
      text-transform: none;
    }
    .meter-domain-placeholder {
      padding: 8px 13px;
      border: 1px dashed var(--border);
      border-radius: 7px;
      font-size: 0.59rem;
      color: var(--txt3);
      font-style: italic;
    }

    /* ─── LAYOUT ─── */
    .app {
      display: flex;
    }

    /* ─── SIDEBAR NAV ─── */
    .nav {
      width: 192px;
      min-width: 192px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      height: calc(100vh - 148px);
      overflow-y: auto;
      position: sticky;
      top: 148px;
      padding: 10px 5px;
      scrollbar-width: thin;
    }
    .nav-label {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--txt3);
      padding: 4px 9px 9px;
    }
    .nav-btn {
      display: flex;
      align-items: center;
      gap: 7px;
      width: 100%;
      padding: 7px 9px;
      background: transparent;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      color: var(--txt2);
      font-size: 0.72rem;
      font-family: inherit;
      text-align: left;
      line-height: 1.3;
      margin-bottom: 1px;
      transition: all .12s;
    }
    .nav-btn:hover { background: rgba(255,255,255,.04); color: var(--txt); }
    .nav-btn.active { background: rgba(255,255,255,.07); color: #f1f5f9; font-weight: 600; }
    .nav-icon { font-size: 0.875rem; min-width: 18px; text-align: center; }
    .nav-inds {
      margin-left: auto;
      display: flex;
      gap: 3px;
      align-items: center;
    }
    .ind {
      width: 5px; height: 5px;
      border-radius: 50%;
    }
    .ind-a { background: rgba(239,68,68,.65); }
    .ind-h { background: rgba(245,158,11,.65); }

    /* ─── MAIN ─── */
    .main {
      flex: 1;
      overflow-y: auto;
      padding: 20px 22px 32px;
      scrollbar-width: thin;
    }

    .cat-hdr {
      margin-bottom: 14px;
    }
    .cat-name {
      font-size: clamp(1rem, 1.2vw + 0.55rem, 1.35rem);
      font-weight: 700;
      letter-spacing: -.015em;
      color: #f1f5f9;
      margin-bottom: 3px;
    }
    .cat-desc {
      font-size: 0.78rem;
      color: var(--txt2);
    }

    /* Verdict strip */
    .verdict {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 8px 13px;
      border-radius: 6px;
      margin-bottom: 14px;
      font-size: 0.72rem;
      font-weight: 600;
      border: 1px solid;
      flex-wrap: wrap;
    }
    .verdict .v-sub { font-weight: 400; color: var(--txt2); font-size: 0.66rem; }
    .vrd-v6   { background: rgba(56,189,248,.06);  border-color: rgba(56,189,248,.2);  color: var(--ipv6); }
    .vrd-v4   { background: rgba(245,158,11,.07);  border-color: rgba(245,158,11,.2);  color: var(--ipv4); }
    .vrd-both { background: rgba(239,68,68,.06);   border-color: rgba(239,68,68,.2);   color: #f87171; }
    .vrd-cont { background: rgba(168,85,247,.06);  border-color: rgba(168,85,247,.2);  color: #c084fc; }

    /* Protocol grid */
    .proto-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .proto-hdr {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-bottom: 9px;
      border-bottom: 2px solid;
      margin-bottom: 11px;
    }
    .proto-hdr.v4 { border-color: var(--ipv4); }
    .proto-hdr.v6 { border-color: var(--ipv6); }

    .proto-badge {
      font-size: 0.59rem;
      font-weight: 800;
      letter-spacing: .1em;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 4px;
    }
    .proto-badge.v4 { background: var(--ipv4-dim); color: var(--ipv4); border: 1px solid var(--ipv4-bdr); }
    .proto-badge.v6 { background: var(--ipv6-dim); color: var(--ipv6); border: 1px solid var(--ipv6-bdr); }

    .proto-name {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--txt);
    }

    /* ─── HEEL CARDS ─── */
    .heel-card {
      border-radius: 7px;
      border: 1px solid;
      margin-bottom: 9px;
      overflow: hidden;
    }
    .heel-card.a { background: var(--ach-dim); border-color: var(--ach-bdr); }
    .heel-card.h { background: var(--her-dim); border-color: var(--her-bdr); }

    .heel-hdr {
      display: flex;
      align-items: flex-start;
      gap: 7px;
      padding: 9px 11px;
      cursor: pointer;
      user-select: none;
    }
    .heel-type {
      font-size: 0.58rem;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
      padding: 2px 5px;
      border-radius: 3px;
      white-space: nowrap;
      margin-top: 2px;
    }
    .heel-type.a {
      background: rgba(239,68,68,.18);
      color: #fca5a5;
      border: 1px solid rgba(239,68,68,.3);
    }
    .heel-type.h {
      background: rgba(245,158,11,.18);
      color: #fcd34d;
      border: 1px solid rgba(245,158,11,.3);
    }
    .heel-title {
      flex: 1;
      font-size: 0.75rem;
      font-weight: 600;
      color: #f1f5f9;
      line-height: 1.35;
    }
    .sev-badge {
      font-size: 0.58rem;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 3px;
      white-space: nowrap;
      margin-top: 2px;
    }
    .sev-critical  { background: rgba(220,38,38,.25);   color: #fca5a5; }
    .sev-high      { background: rgba(239,68,68,.18);   color: #f87171; }
    .sev-medium    { background: rgba(251,146,60,.18);  color: #fdba74; }
    .str-high      { background: rgba(34,197,94,.16);   color: #86efac; }
    .str-medium    { background: rgba(59,130,246,.16);  color: #93c5fd; }
    .str-cond      { background: rgba(168,85,247,.16);  color: #d8b4fe; }
    .str-low       { background: rgba(148,163,184,.12); color: #cbd5e1; }

    .expand-btn {
      color: var(--txt3);
      font-size: 0.625rem;
      margin-top: 3px;
      flex-shrink: 0;
      transition: transform .2s;
    }
    .heel-hdr.open .expand-btn { transform: rotate(180deg); }

    .heel-body {
      padding: 0 11px 11px;
      display: none;
      border-top: 1px solid;
    }
    .heel-card.a .heel-body { border-color: rgba(239,68,68,.1); }
    .heel-card.h .heel-body { border-color: rgba(245,158,11,.1); }
    .heel-body.open { display: block; }

    .heel-detail {
      color: #94a3b8;
      font-size: 0.75rem;
      line-height: 1.78;
      padding-top: 9px;
      margin-bottom: 9px;
    }

    .list-label {
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--txt3);
      margin-bottom: 5px;
    }
    .heel-list { list-style: none; }
    .heel-list li {
      font-size: 0.69rem;
      color: var(--txt3);
      padding: 2.5px 0 2.5px 13px;
      position: relative;
      line-height: 1.45;
    }
    .heel-list li::before {
      content: '▸';
      position: absolute;
      left: 0;
      font-size: 0.53rem;
      top: 4px;
    }
    .heel-card.a .heel-list li::before { color: #ef4444; }
    .heel-card.h .heel-list li::before { color: #f59e0b; }

    .caveat {
      margin-top: 8px;
      padding: 6px 10px;
      background: rgba(168,85,247,.07);
      border: 1px solid rgba(168,85,247,.2);
      border-radius: 5px;
      font-size: 0.66rem;
      color: #c4b5fd;
      font-style: italic;
      line-height: 1.5;
    }

    .no-heel {
      border: 1px dashed rgba(255,255,255,.07);
      border-radius: 7px;
      padding: 13px;
      text-align: center;
      font-size: 0.69rem;
      color: var(--txt3);
      font-style: italic;
      margin-bottom: 9px;
    }

    /* ─── OVERVIEW MODE ─── */
    .overview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
    }
    .ov-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 13px 14px;
      cursor: pointer;
      transition: border-color .15s, background .15s;
    }
    .ov-card:hover {
      border-color: var(--border-lt);
      background: rgba(255,255,255,.03);
    }
    .ov-top {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      margin-bottom: 9px;
    }
    .ov-icon { font-size: 1.125rem; line-height: 1; margin-top: 1px; }
    .ov-cat-name {
      font-size: 0.8125rem;
      font-weight: 600;
      color: #f1f5f9;
      margin-bottom: 2px;
    }
    .ov-cat-desc {
      font-size: 0.66rem;
      color: var(--txt2);
      line-height: 1.45;
    }
    .ov-status {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .ov-proto-cell {
      padding: 5px 8px;
      border-radius: 5px;
      border: 1px solid;
      font-size: 0.625rem;
    }
    .ov-proto-cell.v4 { background: var(--ipv4-dim); border-color: var(--ipv4-bdr); }
    .ov-proto-cell.v6 { background: var(--ipv6-dim); border-color: var(--ipv6-bdr); }
    .ov-proto-label {
      font-size: 0.6rem;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .ov-proto-cell.v4 .ov-proto-label { color: var(--ipv4); }
    .ov-proto-cell.v6 .ov-proto-label { color: var(--ipv6); }
    .ov-chips { display: flex; gap: 3px; flex-wrap: wrap; }
    .ov-chip {
      font-size: 0.55rem;
      font-weight: 700;
      letter-spacing: .07em;
      text-transform: uppercase;
      padding: 1px 5px;
      border-radius: 3px;
    }
    .ov-chip.a { background: rgba(239,68,68,.18); color: #fca5a5; }
    .ov-chip.h { background: rgba(245,158,11,.18); color: #fcd34d; }
    .ov-chip.none { background: rgba(255,255,255,.05); color: var(--txt3); }

    /* ─── VIEW TOGGLE ─── */
    .view-toggle {
      display: flex;
      gap: 4px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 3px;
    }
    .vt-btn {
      font-size: 0.66rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 4px;
      border: none;
      background: transparent;
      color: var(--txt3);
      cursor: pointer;
      font-family: inherit;
      transition: all .12s;
    }
    .vt-btn.active {
      background: rgba(255,255,255,.08);
      color: var(--txt);
    }
    .vt-btn:hover:not(.active) { color: var(--txt2); }

    /* ─── SCROLLBARS ─── */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.1); border-radius: 2px; }

    /* ─── MOBILE ─── */
    @media (max-width: 700px) {
      .nav { width: 100%; min-width: unset; height: auto; position: static; display: flex; overflow-x: auto; padding: 6px 5px; border-right: none; border-bottom: 1px solid var(--border); }
      .nav-label { display: none; }
      .nav-btn { flex-shrink: 0; white-space: nowrap; }
      .nav-inds { display: none; }
      .app { flex-direction: column; }
      .main { padding: 14px 14px 24px; }
      .proto-grid { grid-template-columns: 1fr; }
      .meters { grid-template-columns: 1fr; }
      .hdr-legend { display: none; }
      .overview-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<header class="hdr">
  <div class="hdr-top">
    <div>
      <div class="hdr-eyebrow">Protocol Security Framework · Comparative Analysis</div>
      <div class="hdr-h1">
        IPv4 vs IPv6 —
        <span class="ach-word">Achilles</span> &amp;
        <span class="her-word">Hermes</span> Heel Analysis
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
      <div class="hdr-legend">
        <div class="leg-item"><div class="leg-dot" style="background:#ef4444"></div>Achilles Heel — Built-in structural weakness</div>
        <div class="leg-item"><div class="leg-dot" style="background:#f59e0b"></div>Hermes Heel — Inherent strength when properly deployed</div>
      </div>
      <div class="view-toggle" id="viewToggle">
        <button class="vt-btn active" data-view="cat" onclick="setView('cat',this)">Category View</button>
        <button class="vt-btn" data-view="ov" onclick="setView('ov',this)">Overview Matrix</button>
      </div>
    </div>
  </div>
  <div class="meters-section">
    <div>
      <div class="meter-row-lbl">Overall · All 9 Domains</div>
      <div class="meters" id="meters-overall"></div>
    </div>
    <div>
      <div class="meter-row-lbl">Active Domain <span class="domain-tag" id="meter-domain-name"></span></div>
      <div id="meters-domain"><div class="meter-domain-placeholder">← Select a category to see its individual posture</div></div>
    </div>
  </div>
</header>

<div class="app">
  <nav class="nav" id="nav"></nav>
  <main class="main" id="main"></main>
</div>

<script>
// ══════════════════════════════════════════════════════════
// WEIGHTS
// ══════════════════════════════════════════════════════════
const SEV_WT = { critical: 3, high: 2, medium: 1 };
const STR_WT = { high: 3, medium: 2, conditional: 1, low: 1 };

// ══════════════════════════════════════════════════════════
// DATA
// ══════════════════════════════════════════════════════════
const CATS = [
  {
    id:'address', icon:'⬡', label:'Address Architecture',
    desc:'How the address space drives security architecture decisions — and what NAT dependency creates.',
    verdict:{ type:'v6', icon:'🔵', label:'IPv6 Advantage',
      note:'128-bit space eliminates NAT dependency, restoring direct source attribution and end-to-end accountability.' },
    ipv4:{
      achilles:{
        title:'Address Exhaustion → NAT Dependency',
        severity:'high',
        detail:'The 32-bit address space (~4.3 billion addresses) was exhausted, forcing widespread NAT deployment. NAT obscures true source addresses, breaks end-to-end accountability, complicates forensic attribution, and was never designed as a security mechanism — yet became treated as one. Security posture built on NAT hides the attack surface rather than eliminating it.',
        list:[ 'Source attribution failures in incident response logs',
               'Forensic blind spots — which host behind NAT generated this traffic?',
               'False sense of isolation from NATted network segments',
               'Shared IP reputation — one infected host can blacklist the entire NAT pool' ]
      },
      hermes: null
    },
    ipv6:{
      achilles: null,
      hermes:{
        title:'Vast Address Space Enables True End-to-End Accountability',
        strength:'high',
        detail:'128-bit addressing provides ~3.4 × 10³⁸ unique addresses, eliminating exhaustion and the NAT dependency it created. Every device can receive a globally routable, unique address. This restores the original internet architecture — end-to-end connectivity with direct, unambiguous source attribution — simplifying security policy enforcement, log correlation, and forensic investigation.',
        list:[ 'Direct source attribution without NAT traversal gaps',
               'Simplified policy enforcement — no NAT state tables to track',
               'True end-to-end connectivity enables verifiable, stricter access controls',
               'Cleaner SIEM correlation with stable, globally unique source IPs' ]
      }
    }
  },
  {
    id:'ipsec', icon:'🔐', label:'IPsec Integration',
    desc:'Whether authentication and encryption are native to the protocol or retrofitted post-design.',
    verdict:{ type:'v6', icon:'🔵', label:'IPv6 Advantage (with caveat)',
      note:'IPsec is a first-class design citizen in IPv6, but RFC 6434 (2011) downgraded the MUST requirement to SHOULD.' },
    ipv4:{
      achilles:{
        title:'Security as an Afterthought',
        severity:'high',
        detail:'IPv4 was designed for a trusted academic network — security was not a requirement. IPsec was defined years later (RFC 1825, 1995) and retrofitted as optional extension headers. Implementation is inconsistent across vendors, frequently misconfigured, and never mandatory. The protocol\'s architecture has no security chromosome; it was grafted on after the fact.',
        list:[ 'No mandatory authentication of packet origin at any hop',
               'Plaintext traffic is the default operational state',
               'IPsec misconfiguration is common due to retrofitting complexity',
               'Inconsistent vendor implementations create interoperability vs. security tradeoffs' ]
      },
      hermes: null
    },
    ipv6:{
      achilles:{

// STATE

let currentCat = 0;
let currentView = 'cat';

// ══════════════════════════════════════════════════════════
// SCORES
// ══════════════════════════════════════════════════════════
function calcScores() {
  const s = { v4:{ a:0, h:0 }, v6:{ a:0, h:0 } };
  CATS.forEach(c => {
    const sides = [ [c.ipv4,'v4'], [c.ipv6,'v6'] ];
    sides.forEach(([side, key]) => {
      if (side.achilles) s[key].a += SEV_WT[side.achilles.severity] || 0;
      if (side.hermes)   s[key].h += STR_WT[side.hermes.strength]   || 0;
    });
  });
  return s;
}

// ══════════════════════════════════════════════════════════
// METER CARD BUILDER (shared by overall + domain rows)
// ══════════════════════════════════════════════════════════
function meterCardHTML(label, cls, scores) {
  const { a, h } = scores;
  const total = (a + h) || 1;
  const ap = Math.round(a / total * 100);
  const hp = Math.round(h / total * 100);
  const aLbl = a > 0 ? `${a}pt${a !== 1 ? 's' : ''}` : 'none';
  const hLbl = h > 0 ? `${h}pt${h !== 1 ? 's' : ''}` : 'none';
  return `
    <div class="meter-card">
      <div class="meter-top">
        <span class="meter-proto ${cls}">${label}</span>
        <div class="meter-scores">
          <span class="sc-a">Achilles: ${aLbl}</span>
          <span class="sc-h">Hermes: ${hLbl}</span>
        </div>
      </div>
      <div class="meter-track">
        <div class="bar-a" style="width:0%" data-target="${ap}"></div>
        <div class="bar-h" style="width:0%" data-target="${hp}"></div>
      </div>
      <div class="meter-labels">
        <span style="color:#f87171">◀ ACHILLES (weakness)</span>
        <span style="color:#fbbf24">HERMES (strength) ▶</span>
      </div>
    </div>`;
}

function animateBars(containerId) {
  document.querySelectorAll(`#${containerId} [data-target]`).forEach(bar => {
    bar.style.width = bar.dataset.target + '%';
  });
}

// ══════════════════════════════════════════════════════════
// RENDER METERS
// ══════════════════════════════════════════════════════════
function renderMeters() {
  const s = calcScores();
  document.getElementById('meters-overall').innerHTML =
    meterCardHTML('IPv4', 'v4', s.v4) + meterCardHTML('IPv6', 'v6', s.v6);
}

function updateDomainMeter(idx) {
  const c = CATS[idx];
  const ds = {
    v4: { a: SEV_WT[c.ipv4.achilles?.severity] || 0, h: STR_WT[c.ipv4.hermes?.strength] || 0 },
    v6: { a: SEV_WT[c.ipv6.achilles?.severity] || 0, h: STR_WT[c.ipv6.hermes?.strength] || 0 }
  };
  document.getElementById('meter-domain-name').textContent = `${c.icon} ${c.label}`;
  document.getElementById('meters-domain').innerHTML =
    `<div class="meters">
      ${meterCardHTML('IPv4', 'v4', ds.v4)}
      ${meterCardHTML('IPv6', 'v6', ds.v6)}
    </div>`;
  setTimeout(() => animateBars('meters-domain'), 30);
}

// ══════════════════════════════════════════════════════════
// RENDER NAV
// ══════════════════════════════════════════════════════════
function renderNav() {
  const nav = document.getElementById('nav');
  nav.innerHTML = `<div class="nav-label">Categories</div>` +
    CATS.map((c, i) => {
      const hasA4 = !!c.ipv4.achilles, hasH4 = !!c.ipv4.hermes;
      const hasA6 = !!c.ipv6.achilles, hasH6 = !!c.ipv6.hermes;
      const hasA = hasA4 || hasA6, hasH = hasH4 || hasH6;
      return `
        <button class="nav-btn${i===0?' active':''}" data-idx="${i}" onclick="navClick(${i})">
          <span class="nav-icon">${c.icon}</span>
          <span>${c.label}</span>
          <div class="nav-inds">
            ${hasA ? '<div class="ind ind-a"></div>' : ''}
            ${hasH ? '<div class="ind ind-h"></div>' : ''}
          </div>
        </button>`;
    }).join('');
}

function navClick(idx) {
  currentCat = idx;
  document.querySelectorAll('.nav-btn').forEach((b,i) =>
    b.classList.toggle('active', i === idx));
  if (currentView === 'cat') renderCategory(idx);
  updateDomainMeter(idx);
}

// HELPERS
// ══════════════════════════════════════════════════════════
function sevBadge(sev) {
  if (!sev) return '';
  const map = { critical:'sev-critical', high:'sev-high', medium:'sev-medium' };
  return `<span class="sev-badge ${map[sev]||''}">${sev.toUpperCase()}</span>`;
}

function strBadge(str) {
  if (!str) return '';
  const cls  = { high:'str-high', medium:'str-medium', conditional:'str-cond', low:'str-low' }[str] || '';
  const lbl  = { high:'STRONG', medium:'MODERATE', conditional:'CONDITIONAL', low:'LIMITED'  }[str] || str.toUpperCase();
  return `<span class="sev-badge ${cls}">${lbl}</span>`;
}

let uidCounter = 0;
function uid() { return 'h' + (++uidCounter); }

function heelCardHTML(heel, type) {
  if (!heel) {
    const lbl = type === 'a'
      ? 'No Achilles Heel identified in this domain'
      : 'No Hermes Heel identified in this domain';
    return `<div class="no-heel">${lbl}</div>`;
  }
  const id   = uid();
  const tLbl = type === 'a' ? 'ACHILLES HEEL' : 'HERMES HEEL';
  const badge = type === 'a' ? sevBadge(heel.severity) : strBadge(heel.strength);
  const listLbl = type === 'a' ? 'ATTACK VECTORS' : 'INHERENT ADVANTAGES';
  const items   = heel.list || [];
  return `
    <div class="heel-card ${type}">
      <div class="heel-hdr open" id="${id}h" onclick="toggle('${id}')">
        <span class="heel-type ${type}">${tLbl}</span>
        <span class="heel-title">${heel.title}</span>
        ${badge}
        <span class="expand-btn">▼</span>
      </div>
      <div class="heel-body open" id="${id}b">
        <p class="heel-detail">${heel.detail}</p>
        ${items.length ? `
          <div class="list-label">${listLbl}</div>
          <ul class="heel-list">${items.map(v=>`<li>${v}</li>`).join('')}</ul>
        ` : ''}
        ${heel.caveat ? `<div class="caveat">⚠ ${heel.caveat}</div>` : ''}
      </div>
    </div>`;
}

function toggle(id) {
  const hdr  = document.getElementById(id + 'h');
  const body = document.getElementById(id + 'b');
  if (!hdr || !body) return;
  hdr.classList.toggle('open');
  body.classList.toggle('open');
}

function verdictHTML(v) {
  const cls = { v6:'vrd-v6', v4:'vrd-v4', both:'vrd-both', cont:'vrd-cont' }[v.type] || 'vrd-cont';
  return `
    <div class="verdict ${cls}">
      <span style="font-size:0.875rem">${v.icon}</span>
      <span><strong>${v.label}</strong>
        <span class="v-sub">— ${v.note}</span>
      </span>
    </div>`;
}

// ══════════════════════════════════════════════════════════
// RENDER CATEGORY
// ══════════════════════════════════════════════════════════
function renderCategory(idx) {
  const c = CATS[idx];
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="cat-hdr">
      <div class="cat-name">${c.label}</div>
      <div class="cat-desc">${c.desc}</div>
    </div>
    ${verdictHTML(c.verdict)}
    <div class="proto-grid">
      <div>
        <div class="proto-hdr v4">
          <span class="proto-badge v4">IPv4</span>
          <span class="proto-name">Internet Protocol Version 4</span>
        </div>
        ${heelCardHTML(c.ipv4.achilles,'a')}
        ${heelCardHTML(c.ipv4.hermes,'h')}
      </div>
      <div>
        <div class="proto-hdr v6">
          <span class="proto-badge v6">IPv6</span>
          <span class="proto-name">Internet Protocol Version 6</span>
        </div>
        ${heelCardHTML(c.ipv6.achilles,'a')}
        ${heelCardHTML(c.ipv6.hermes,'h')}
      </div>
    </div>`;
  main.scrollTop = 0;
}

// ══════════════════════════════════════════════════════════
// RENDER OVERVIEW
// ══════════════════════════════════════════════════════════
function renderOverview() {
  const main = document.getElementById('main');
  const chips = (side) => {
    const a = side.achilles, h = side.hermes;
    if (!a && !h) return `<span class="ov-chip none">NONE</span>`;
    return `
      ${a ? `<span class="ov-chip a">Achilles · ${(a.severity||'').toUpperCase()}</span>` : ''}
      ${h ? `<span class="ov-chip h">Hermes · ${({high:'STRONG',medium:'MOD.',conditional:'COND.',low:'LTD.'}[h.strength]||'')}</span>` : ''}`;
  };

  main.innerHTML = `
    <div class="cat-hdr">
      <div class="cat-name">Overview Matrix</div>
      <div class="cat-desc">All 9 security domains at a glance — click any card to dive into full detail.</div>
    </div>
    <div class="overview-grid">
      ${CATS.map((c, i) => `
        <div class="ov-card" onclick="drillDown(${i})">
          <div class="ov-top">
            <div class="ov-icon">${c.icon}</div>
            <div>
              <div class="ov-cat-name">${c.label}</div>
              <div class="ov-cat-desc">${c.desc}</div>
            </div>
          </div>
          <div class="ov-status">
            <div class="ov-proto-cell v4">
              <div class="ov-proto-label">IPv4</div>
              <div class="ov-chips">${chips(c.ipv4)}</div>
            </div>
            <div class="ov-proto-cell v6">
              <div class="ov-proto-label">IPv6</div>
              <div class="ov-chips">${chips(c.ipv6)}</div>
            </div>
          </div>
        </div>
      `).join('')}
    </div>`;
  main.scrollTop = 0;
}

function drillDown(idx) {
  setView('cat', document.querySelector('[data-view="cat"]'));
  currentCat = idx;
  document.querySelectorAll('.nav-btn').forEach((b,i) =>
    b.classList.toggle('active', i === idx));
  renderCategory(idx);
}

// ══════════════════════════════════════════════════════════
// VIEW TOGGLE
// ══════════════════════════════════════════════════════════
function setView(view, btn) {
  currentView = view;
  document.querySelectorAll('.vt-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.view === view));
  if (view === 'cat') {
    document.getElementById('nav').style.display = '';
    renderCategory(currentCat);
  } else {
    document.getElementById('nav').style.display = 'none';
    renderOverview();
  }
}

// ══════════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════════
renderMeters();
renderNav();
renderCategory(0);
setTimeout(() => animateBars('meters-overall'), 120);
updateDomainMeter(0);
</script>
</body>
</html>
